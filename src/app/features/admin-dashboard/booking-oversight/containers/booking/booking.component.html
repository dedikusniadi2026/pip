<div class="p-8">
<div class="flex items-start justify-between mb-6">
<div>
  <h1 class="text-4xl font-extrabold text-slate-800">Bookings</h1>
  <p class="text-slate-500">Manage all your tourist driver bookings</p>
</div>
<button (click)="AddDialog()" class="bg-teal-600 text-white px-5 py-2 rounded-xl shadow hover:bg-teal-700">New Booking</button>
</div>


<div class="flex gap-4 items-center mb-6">
<div class="flex-1">
<input [(ngModel)]="search"
  class="w-full rounded-xl border border-slate-200 px-4 py-3 shadow-sm placeholder-slate-400"
  placeholder="Search bookings..." />
</div>


<div class="w-48">
<select class="w-full rounded-xl border border-slate-200 px-4 py-3" [(ngModel)]="statusFilter">
<option>All Status</option>
<option>Confirmed</option>
<option>Pending</option>
<option>In progress</option>
</select>
</div>
</div>


<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
  <ng-container *ngFor="let b of filtered;">
    <app-booking-card [booking]="b"></app-booking-card>
  </ng-container>
</div>
</div>
