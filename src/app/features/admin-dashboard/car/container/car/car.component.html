<div class="p-6">
  <div class="flex flex-wrap justify-between items-center mb-6 gap-3">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Car</h1>
      <p class="text-gray-500">Manage your fleet of Car</p>
    </div>

    <button (click)="AddDialog()" class="bg-teal-600 text-white px-5 py-2 rounded-xl shadow hover:bg-teal-700">
      <i class="ri-add-line text-xl"></i> New Car
    </button>
  </div>

  <div class="flex flex-wrap gap-4 mb-6">
    <div class="flex items-center bg-white border rounded-lg px-4 py-2 w-full md:w-1/3">
      <i class="ri-search-line text-gray-400 text-lg"></i>
      <input
        type="text"
        placeholder="Search vehicles..."
        class="ml-2 w-full outline-none text-gray-700"
      />
    </div>

    <select
      class="bg-white border rounded-lg px-4 py-2 text-gray-700 cursor-pointer w-full md:w-40">
      <option>All Status</option>
      <option>Active</option>
      <option>Maintenance</option>
    </select>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

    <div
      *ngFor="let v of vehicles"
      class="bg-white border rounded-xl p-6 shadow-sm hover:shadow-md transition-all"
    >
      <div class="flex items-start gap-4 mb-4">
        <div class="w-12 h-12 flex items-center justify-center bg-blue-50 text-blue-600 rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-car h-6 w-6 text-primary"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
        </div>

        <div>
          <h2 class="text-lg font-semibold text-gray-900">{{ v.name }}</h2>
          <p class="text-gray-500 text-sm">{{ v.year }} • {{ v.plate }}</p>
        </div>
      </div>

      <div class="flex justify-between items-center mb-4">
        <p class="text-gray-600 font-medium">Status</p>
        <span
          class="px-3 py-1 rounded-full text-xs font-medium"
          [ngClass]="{
            'bg-green-100 text-green-700': v.status === 'active',
            'bg-yellow-100 text-yellow-700': v.status === 'maintenance'
          }"
        >
          {{ v.status }}
        </span>
      </div>

      <div class="grid grid-cols-2 gap-y-2 text-sm mb-6">
        <p class="text-gray-500">Driver</p>
        <p class="text-gray-700 font-medium text-right">{{ v.driver }}</p>

        <p class="text-gray-500">Capacity</p>
        <p class="text-gray-700 text-right">{{ v.capacity }}</p>

        <p class="text-gray-500">Color</p>
        <p class="text-gray-700 text-right">{{ v.color }}</p>

        <p class="text-gray-500">Mileage</p>
        <p class="text-gray-700 text-right">{{ v.mileage }}</p>

        <p class="text-gray-500">Last Service</p>
        <p class="text-gray-700 text-right">{{ v.lastService }}</p>
      </div>

      <div class="flex gap-3">
        <button (click)="viewDetails()" class="flex-1 border rounded-lg py-2 hover:bg-gray-100">
          View Details
        </button>
      </div>
    </div>
  </div>
</div>
