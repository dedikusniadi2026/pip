<div class="p-6 space-y-6">
  <div class="flex items-start justify-between mb-6">
<div>
<h1 class="text-4xl font-extrabold text-slate-800">Drivers</h1>
<p class="text-slate-500">Manage your driver team</p>
</div>
<button (click)="AddDialog()" class="bg-teal-600 text-white px-5 py-2 rounded-xl shadow hover:bg-teal-700">New Drivers</button>
</div>
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Search drivers..."
    class="w-full border rounded-lg px-3 py-2"/>

  <div class="grid md:grid-cols-3 gap-6">
  <div *ngFor="let d of filteredDrivers" class="p-5 border rounded-xl shadow-sm bg-white space-y-3 relative">

    <div class="absolute top-3 right-3">
      <button (click)="toggleDropdown(d.id)" class="p-1 rounded hover:bg-gray-100">
        ⋮
      </button>

      <div *ngIf="d.showDropdown" class="mt-2 w-32 bg-white border rounded shadow-lg absolute right-0 z-20">
        <button (click)="suspendDriver(d.id)" class="block w-full text-left px-3 py-2 text-sm hover:bg-gray-100">Suspend</button>
        <button (click)="deleteDriver(d.id)" class="block w-full text-left px-3 py-2 text-sm hover:bg-gray-100">Delete</button>
      </div>
    </div>

    <img [src]="d.avatar" [alt]="d.name" class="w-16 h-16 rounded-full object-cover" />
    <div class="text-lg font-semibold">{{ d.name }}</div>
    <div class="text-sm text-gray-600">{{ d.car }}</div>

   <div class="space-y-2 text-gray-700 text-sm">
  <div class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" 
         fill="none" 
         viewBox="0 0 30 30" 
         stroke-width="1.5" 
         stroke="currentColor" 
         class="w-5 h-5 text-gray-500">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
    </svg>
    <span>{{ d.email }}</span>
  </div>
  <div class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" 
         fill="none" 
         viewBox="0 0 30 30" 
         stroke-width="1.5" 
         stroke="currentColor" 
         class="w-5 h-5 text-gray-500">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25
           a2.25 2.25 0 0 0 2.25-2.25v-1.372
           c0-.516-.351-.966-.852-1.091l-4.423-1.106
           c-.44-.11-.902.055-1.173.417l-.97 1.293
           c-.282.376-.769.542-1.21.38
           a12.035 12.035 0 0 1-7.143-7.143
           c-.162-.441.004-.928.38-1.21l1.293-.97
           c.363-.271.527-.734.417-1.173L6.963 3.102
           a1.125 1.125 0 0 0-1.091-.852H4.5
           A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
    </svg>
    <span>{{ d.phone }}</span>
  </div>
</div>
    <div class="flex justify-between items-center pt-3 border-t">
      <div class="flex items-center gap-2 text-sm text-gray-700">
      <svg xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-5 h-5 text-amber-400">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442
            c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385
            a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54
            a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602
            a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
      </svg>
      <span>{{ d.rating }}</span>
      <span class="ml-2 text-gray-500">Trips: {{ d.trips }}</span>
    </div>
      <span class="px-3 py-1 rounded-full text-xs"
            [class.bg-red-200]="d.status === 'InActive'"
            [class.bg-green-200]="d.status === 'Active'"
            [class.bg-gray-300]="d.status === 'Busy'">
        {{ d.status }}
      </span>
    </div>
  </div>
</div>
</div>
