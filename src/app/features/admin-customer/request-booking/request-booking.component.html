<div class="max-w-xl mx-auto p-6 bg-white shadow-lg rounded-lg mt-6">
  <h2 class="text-2xl font-semibold mb-4">Request Booking</h2>

  <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()" class="space-y-4">

    <div>
      <label class="block mb-1 font-medium">Travel Date</label>
      <input type="date" formControlName="travelDate" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>

    <div class="relative">
      <label class="block mb-1 font-medium">Pickup Location</label>
      <input type="text" formControlName="pickupLocation" placeholder="Search pickup" (input)="searchAddress($event.target.value,'pickup')" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
      <ul *ngIf="pickupSuggestions.length" class="absolute bg-white border w-full max-h-40 overflow-auto z-50">
        <li *ngFor="let s of pickupSuggestions" (click)="selectSuggestion(s,'pickup')" class="p-2 hover:bg-cyan-100 cursor-pointer">{{ s.display_name }}</li>
      </ul>
    </div>

    <div class="relative">
      <label class="block mb-1 font-medium">Drop-off Location</label>
      <input type="text" formControlName="dropoffLocation" placeholder="Search drop-off" (input)="searchAddress($event.target.value,'dropoff')" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
      <ul *ngIf="dropoffSuggestions.length" class="absolute bg-white border w-full max-h-40 overflow-auto z-50">
        <li *ngFor="let s of dropoffSuggestions" (click)="selectSuggestion(s,'dropoff')" class="p-2 hover:bg-cyan-100 cursor-pointer">{{ s.display_name }}</li>
      </ul>
    </div>

    <br>

   <div class="w-full h-96 mt-2 rounded-lg border overflow-hidden">
    <div id="map" #mapContainer class="w-full h-full"></div>
  </div>

    <div *ngIf="distanceKm>0" class="text-gray-700 font-medium mt-2">
      Estimated Distance: {{ distanceKm }} km
    </div>
    <div *ngIf="estimatedCost>0" class="text-gray-700 font-medium">
      Estimated Cost: Rp {{ estimatedCost.toLocaleString() }}
    </div>

    <div>
      <label class="block mb-1 font-medium">Passengers</label>
      <input type="number" formControlName="passengers" min="1" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>

    <div>
      <label class="block mb-1 font-medium">Payment Type</label>
      <select formControlName="paymentType" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <option *ngFor="let type of paymentTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-semibold py-2 px-4 rounded transition">
      Submit Booking
    </button>
  </form>
</div>
