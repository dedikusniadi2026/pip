<div class="min-h-screen flex">
  <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-cyan-500 to-cyan-300 z-10 opacity-70 bg-cyan-600/60 backdrop-blur-md"></div>
    <img src="../../../../assets/hero-login.jpg" alt="Tourist destination" class="object-cover w-full h-full" />
    <div class="absolute inset-0 z-20 flex flex-col justify-center px-12 text-white">
      <div class="flex items-center gap-3 mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-car h-8 w-8 text-primary"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
        <h1 class="text-4xl font-bold">DriveBook</h1>
      </div>
      <h2 class="text-5xl font-bold mb-4 leading-tight">Premium Tourist<br />Driver Services</h2>
      <p class="text-xl text-white/90 max-w-md">
        Professional drivers, luxury vehicles, unforgettable journeys across paradise destinations.
      </p>
    </div>
  </div>

  <div class="flex-1 flex items-center justify-center p-8 bg-muted/30">
    <div class="w-full max-w-md shadow-lg bg-white rounded-lg">
      <div class="p-6 border-b">
        <h3 class="text-2xl font-bold">Welcome back</h3>
        <p class="text-sm text-muted-foreground">Enter your credentials to access your dashboard</p>
      </div>

      <div class="p-6">
        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-gray-700">Username</label>
            <input
              id="email"
              type="text"
              [(ngModel)]="username"
              name="username"
              required
              class="w-full rounded-md border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
              placeholder="Enter your username"
            />
          </div>

          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <div class="relative">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                name="password"
                required
                class="w-full rounded-md border px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-primary"
                placeholder="Enter your password"
              />
              <button
                type="button"
                (click)="showPassword = !showPassword"
                class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-700">
                <svg *ngIf="!showPassword" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                  <line x1="2" x2="22" y1="2" y2="22" />
                </svg>
                <svg *ngIf="showPassword" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div *ngIf="error" class="text-red-600 text-sm bg-red-50 border border-red-200 p-2 rounded-md">
            {{ errorMessage }}
          </div>

          <button
            type="submit"
            [disabled]="loading"
            class="w-full inline-flex items-center justify-center rounded-md bg-cyan-600 text-white px-4 py-2 hover:opacity-95 disabled:opacity-50">
            <span *ngIf="!loading">Sign In</span>
            <span *ngIf="loading" class="flex items-center gap-2">
              <svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"></circle>
                <path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8v8H4z"></path>
              </svg>
              Loading...
            </span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
