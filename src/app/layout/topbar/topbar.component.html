<header class="w-full bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700 px-4 py-3 flex items-center justify-between gap-4">
  <div class="flex items-center gap-3">
    <button class="md:hidden p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-700">
      <svg class="w-6 h-6 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <div class="flex items-center gap-3 ml-auto">
    <div class="relative">
      <details class="relative">
        <summary class="flex flex-col items-center cursor-pointer list-none p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700">
          <img src="https://i.pravatar.cc/36" class="w-8 h-8 rounded-full" alt="avatar" />
          <span class="text-xs text-slate-700 dark:text-slate-200 mt-1">Dedi Kusniadi</span>
        </summary>

        <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded shadow-md z-50 py-1">
          <a href="#" class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Profile</a>
          <a href="#" class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Settings</a>
          <button (click)="logout()" class="w-full text-left block px-4 py-2 text-sm text-red-600 hover:bg-slate-100 dark:hover:bg-slate-700">Logout</button>
        </div>
      </details>
    </div>
  </div>
</header>
