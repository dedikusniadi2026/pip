<aside
  [class.w-64]="!collapsed"
  [class.w-20]="collapsed"
  class="h-screen bg-cyan-800 text-white flex flex-col shadow-lg transition-all duration-300 ease-in-out overflow-hidden"
  aria-expanded="{{!collapsed}}"
>
  <div class="px-4 py-4 border-b border-white/10 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-car h-8 w-8 text-primary"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
      </div>
      <h1 *ngIf="!collapsed" class="text-2xl font-bold tracking-wide">DriveBook</h1>
    </div>
    <button
      (click)="toggleSidebar()"
      class="p-2 rounded hover:bg-cyan-700/40 focus:outline-none"
      aria-label="Toggle sidebar"
      title="Toggle sidebar"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <nav class="flex-1 px-1 py-4 space-y-1 text-gray-100">
    <a *ngIf="canShow(['Admin'])" 
      routerLink="/admin/dashboard" 
      routerLinkActive="bg-cyan-700 text-white"
      class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Dashboard' : ''">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round"
      stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M13 5v6h6m-6 4v6h6a2 2 0 002-2v-4m-8 6H5a2 2 0 01-2-2v-4h6v6z"/></svg>
    <span
    *ngIf="!collapsed" class="text-sm font-medium">Dashboard</span>
  </a>

  <a *ngIf="canShow(['Admin'])"
      routerLink="/admin/booking" 
      routerLinkActive="bg-cyan-700 text-white"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Booking' : ''"
      class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
      d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Booking</span>
  </a>

  <a *ngIf="canShow(['Admin'])" 
      routerLink="/admin/drivers" 
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Drivers' : ''"
      routerLinkActive="bg-cyan-700 text-white"
     class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
      d="M5.121 17.804A3 3 0 007 19h10a3 3 0 002.879-1.196l1.341-1.928A1 1 0 0020.341 14H3.659a1 1 0 00-.879 1.876l1.341 1.928z"/><path stroke-linecap="round" stroke-linejoin="round" d="M7 10a5 5 0 1110 0v1H7v-1z"/></svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Drivers</span>
  </a>

  <a *ngIf="canShow(['Admin'])" 
      routerLink="/admin/car" 
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Car' : ''"
      routerLinkActive="bg-cyan-700 text-white"
     class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
</svg>

    <span *ngIf="!collapsed" class="text-sm font-medium">Car</span>
  </a>

  <a *ngIf="canShow(['Admin'])" 
      routerLink="/admin/payment" 
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Payment' : ''"
      routerLinkActive="bg-cyan-700 text-white"
     class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z" />
    </svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Payment</span>
  </a>


  <a *ngIf="canShow(['Admin'])" 
      routerLink="/admin/history" 
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Trip History' : ''"
      routerLinkActive="bg-cyan-700 text-white"
     class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
</svg>

    <span *ngIf="!collapsed" class="text-sm font-medium">Trip History</span>
  </a>




  <a *ngIf="canShow(['Driver'])" 
     routerLink="/booking-driver"
     [class.justify-center]="collapsed"
     [title]="collapsed ? 'Booking Requests' : ''"
     routerLinkActive="bg-cyan-700 text-white"
     class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
     <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
       viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
       d="M9 17v-6a2 2 0 012-2h6a2 2 0 012 2v6m-8 0h8"/></svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Booking Requests</span>
  </a>

  <a *ngIf="canShow(['Driver'])" 
     routerLink="/booking-driver"
     [class.justify-center]="collapsed"
     [title]="collapsed ? 'Schedule' : ''"
     routerLinkActive="bg-cyan-700 text-white"
     class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
     <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
       viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
       d="M9 12h6m-6 4h6m-6-8h6m2 10V6a2 2 0 00-2-2H7a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2z"/></svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Schedule</span>
  </a>

  <a *ngIf="canShow(['Customer'])" 
     routerLink="/home" 
     [class.justify-center]="collapsed"
     [title]="collapsed ? 'Home' : ''"
     routerLinkActive="bg-cyan-700 text-white"
     class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
     <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
       viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
       d="M3 12l2-2m0 0l7-7 7 7m-9 2v8m4 0v-8"/></svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Home</span>
  </a>

  <a *ngIf="canShow(['Customer'])" 
    routerLink="/packages" 
    routerLinkActive="bg-cyan-700 text-white"
    [class.justify-center]="collapsed"
    [title]="collapsed ? 'Packages' : ''"
    class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
     <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
       viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
       d="M20 13V9a1 1 0 00-1-1h-6V4l-7 8 7 8v-4h6a1 1 0 001-1z"/></svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Packages</span>
  </a>

  <a *ngIf="canShow(['Customer'])" 
      routerLink="/drivers" 
      routerLinkActive="bg-cyan-700 text-white"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Driver Detail' : ''"
      class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
     <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
       viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
       d="M12 14l9-5-9-5-9 5 9 5zm0 7v-6m0-7v-2m0 16l9-5"/></svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Driver Detail</span>
  </a>

  <a *ngIf="canShow(['Customer'])" 
     routerLink="/admin/booking-customers" 
     routerLinkActive="bg-cyan-700 text-white"
     [class.justify-center]="collapsed"
     [title]="collapsed ? 'Request Booking' : ''"
     class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-cyan-800 transition-all cursor-pointer">
     <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
       viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
       d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    <span *ngIf="!collapsed" class="text-sm font-medium">Request Booking</span>
  </a>    
  </nav>

  <div class="border-t border-white/10 p-3 flex items-center gap-3 transition-all">
    <img src="https://i.pravatar.cc/40" class="w-10 h-10 rounded-full object-cover" alt="User Avatar" />
    <div *ngIf="!collapsed" class="truncate">
      <p class="text-sm font-semibold leading-4">Dedi Kusniadi</p>
      <p class="text-xs text-white/60">{{ role || 'User' }}</p>
    </div>
    <div *ngIf="collapsed" class="ml-auto text-xs text-white/60">
    </div>
  </div>
</aside>
